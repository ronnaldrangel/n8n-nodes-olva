name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) necesita npm 11.5.1 o superior.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      - name: Publicar en npm
        run: npm publish --access public --provenance
        env:
          # Token de npm (repo → Settings → Secrets → Actions → NPM_TOKEN).
          # Si borras el secreto, cae al modo trusted publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
